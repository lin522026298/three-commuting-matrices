name: Check the three-matrix proof over arbitrary fields
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the source manifest
        run: python3 scripts/replay.py --sources-only
      - name: Install elan
        run: |
          curl --fail --silent --show-error --location https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned upstream imports
        run: python3 scripts/replay.py --fetch-cache
      - name: Rebuild from an empty project object directory
        run: lake env python3 scripts/replay.py
