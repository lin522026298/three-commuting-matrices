fidelity:
  divergences: "The paper uses transverse arcs at closed points. The formal argument takes a finite jet at a generic point over a perfect base field and transfers the actions to power series. It descends the bound to the given field. The method of constructing the arc differs; the dimension bound and its field hypotheses agree."
review:
  status: "Author-released preprint with machine checks"
  reviewers: []
  notes: "The v1.1 proof companion reports the standard three axioms for both endpoints and records independent nanoda replay of the complex proof export. That export is specific to v1.1 and to the complex theorem. No external human referee report is claimed."
alignment:
  namespace: "Gerstenhaber"
  statements:
    - source: "Main theorem of the paper"
      lean: "Gerstenhaber.finrank_adjoin_triple_le"
      module: "Solution"
      status: proved
      note: "The hypothesis is Set.Pairwise Commute on the three generators and the conclusion bounds the finrank of their unital Algebra.adjoin. When two generators coincide they commute by reflexivity."
