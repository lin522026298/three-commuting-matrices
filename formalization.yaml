    authors: ["Yan-cheng Lin"]
    id: "10.5281/zenodo.24346423"
    type: preprint
    location: "https://doi.org/10.5281/zenodo.24346423"
    relationship: formalizes
    note: "The statement is the main theorem of the author's preprint, including fields of positive characteristic."
  - title: "On the algebra generated by three commuting matrices: combinatorial cases"
    authors: ["Ron Cherny", "Matthew Satriano", "Yohan Song"]
    id: "10.37236/12909"
    relationship: background
    note: "States the problem and proves classes of combinatorial cases."
  - title: "Linear bound for commuting matrix algebra II"
    authors: ["Caihua Luo", "Xu Song", "Yilin Zeng"]
    id: "arXiv:2611.11550"
    relationship: background
    note: "Gives the bound 2n-2 for triples of size n at least two."
