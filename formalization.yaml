version: "v0.4"
project:
  name: "The Gerstenhaber dimension bound for three commuting matrices over arbitrary fields"
  description: >-
    Three commuting square matrices of size n over any field
    generate a unital subalgebra of dimension at most n. The proof studies
    the actions on the kernel and cokernel of a nilpotent generator.
  authors: ["Yan-cheng Lin"]
  responsible_maintainers: ["Yan-cheng Lin"]
  license: MIT
classification:
  arxiv: ["math.RA"]
  msc2020: ["15A27", "13E10"]
sources:
